name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Extract version
        run: |
          echo "APP_VERSION=${{ needs.release.outputs.new_release_version }}" >> $GITHUB_ENV
          mkdir -p ./frontend/public
          echo "{\"version\": \"${{ needs.release.outputs.new_release_version }}\", \"hash\": \"$(git rev-parse --short HEAD)\"}" > ./frontend/public/version.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Frontend (React Assets Only)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build:ui

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ./frontend/dist

  deploy-web:
    needs: [release, build-frontend]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Build Python Wheels and Merge
        run: |
          bash scripts/build_py.sh
          mkdir -p ./frontend-dist/wheels
          cp frontend/public/wheels/* ./frontend-dist/wheels/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./frontend-dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-desktop:
    needs: [release, build-frontend]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            ext: AppImage
            sep: ":"
            pyinstaller_args: "--onedir"
          - os: windows-latest
            name: windows
            ext: exe
            sep: ";"
            pyinstaller_args: "--onefile"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"



      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Build Backend (PyInstaller)
        working-directory: ./backend
        run: |
          uv sync --extra desktop
          # We run pyinstaller through uv
          uv run pyinstaller --name can-re --noconfirm ${{ matrix.pyinstaller_args }} --windowed --add-data "../frontend-dist${{ matrix.sep }}dist" src/can_re/main.py

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        working-directory: ./backend/dist
        run: |
          mkdir -p can-re.AppDir/usr/bin
          cp -r can-re/* can-re.AppDir/
          echo '#!/bin/sh' > can-re.AppDir/AppRun
          echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> can-re.AppDir/AppRun
          echo 'exec "${HERE}/can-re" "$@"' >> can-re.AppDir/AppRun
          chmod +x can-re.AppDir/AppRun
          echo '[Desktop Entry]' > can-re.AppDir/can-re.desktop
          echo 'Name=can-re' >> can-re.AppDir/can-re.desktop
          echo 'Exec=can-re' >> can-re.AppDir/can-re.desktop
          echo 'Icon=can-re' >> can-re.AppDir/can-re.desktop
          echo 'Type=Application' >> can-re.AppDir/can-re.desktop
          echo 'Categories=Utility;' >> can-re.AppDir/can-re.desktop
          touch can-re.AppDir/can-re.png
          wget -q https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run can-re.AppDir can-re-${{ matrix.name }}-v${{ needs.release.outputs.new_release_version }}.AppImage

      - name: Prepare Executable (Windows)
        if: runner.os == 'Windows'
        working-directory: ./backend/dist
        run: |
          Rename-Item -Path can-re.exe -NewName can-re-${{ matrix.name }}-v${{ needs.release.outputs.new_release_version }}.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: backend/dist/can-re-${{ matrix.name }}-v${{ needs.release.outputs.new_release_version }}.${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: can-re-${{ matrix.name }}
          path: backend/dist/can-re-${{ matrix.name }}-v${{ needs.release.outputs.new_release_version }}.${{ matrix.ext }}
