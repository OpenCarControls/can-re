name: Build and Deploy

on:
  push:
    tags: ["v*.*.*"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Frontend (React Assets Only)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build:ui

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ./frontend/dist

  deploy-web:
    needs: [build-frontend]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Build Python Wheels and Merge
        run: |
          bash scripts/build_py.sh
          mkdir -p ./frontend-dist/wheels
          cp frontend/public/wheels/*.whl ./frontend-dist/wheels/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./frontend-dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-desktop:
    needs: [build-frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Install System Dependencies for PyWebView
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Build Backend (PyInstaller)
        working-directory: ./backend
        run: |
          uv sync --extra desktop
          # We run pyinstaller through uv
          uv run pyinstaller --noconfirm --onedir --windowed --add-data "../frontend-dist:dist" src/can_debug/main.py

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CAN-AI-Debugger-Linux
          path: backend/dist/main/
